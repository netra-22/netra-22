<svg width="1000" height="270" viewBox="0 0 1000 270"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main dark gradient -->
    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">

      <stop offset="0%" stop-color="#071827"/>
      <stop offset="35%" stop-color="#0A4263"/>
      <stop offset="65%" stop-color="#075A88"/>
      <stop offset="100%" stop-color="#142B63"/>

    </linearGradient>


    <!-- Blue / cyan glow -->
    <linearGradient id="glow"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>

    </linearGradient>


    <!-- Soft light -->
    <radialGradient id="light">

      <stop offset="0%"
            stop-color="#38BDF8"
            stop-opacity="0.18"/>

      <stop offset="100%"
            stop-color="#020617"
            stop-opacity="0"/>

    </radialGradient>


    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>


    <!-- Clip for coding elements -->
    <clipPath id="headerClip">

      <rect
        x="0"
        y="0"
        width="1000"
        height="270"
        rx="15"
      />

    </clipPath>

  </defs>


  <!-- ========================================== -->
  <!-- BACKGROUND -->
  <!-- ========================================== -->

  <rect
    width="1000"
    height="270"
    rx="15"
    fill="url(#bg)"
  />


  <!-- Soft blue glow -->

  <ellipse
    cx="500"
    cy="100"
    rx="420"
    ry="170"
    fill="url(#light)"
    filter="url(#blur)"
  />


  <!-- ========================================== -->
  <!-- SUBTLE CODING GRID -->
  <!-- ========================================== -->

  <g
    stroke="#BFEFFF"
    stroke-width="1"
    opacity="0.06"
  >

    <line x1="0" y1="55" x2="1000" y2="55"/>
    <line x1="0" y1="105" x2="1000" y2="105"/>
    <line x1="0" y1="155" x2="1000" y2="155"/>
    <line x1="0" y1="205" x2="1000" y2="205"/>

    <line x1="100" y1="0" x2="100" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="270"/>
    <line x1="500" y1="0" x2="500" y2="270"/>
    <line x1="700" y1="0" x2="700" y2="270"/>
    <line x1="900" y1="0" x2="900" y2="270"/>

  </g>


  <!-- ========================================== -->
  <!-- FLOATING CODE -->
  <!-- ========================================== -->

  <g
    clip-path="url(#headerClip)"
    font-family="monospace"
    fill="#DDF8FF"
    opacity="0.20"
  >

    <text x="55" y="75" font-size="16">
      &lt;/&gt;
    </text>

    <text x="145" y="170" font-size="14">
      0101 0010
    </text>

    <text x="810" y="70" font-size="16">
      { }
    </text>

    <text x="885" y="165" font-size="14">
      =&gt;
    </text>

    <text x="75" y="215" font-size="13">
      const idea = build();
    </text>

    <text x="760" y="215" font-size="13">
      while(learning)
    </text>


    <!-- Gentle movement -->

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="20 0"
      dur="10s"
      repeatCount="indefinite"
    />

  </g>


  <!-- ========================================== -->
  <!-- CONNECTED CODING NODES -->
  <!-- ========================================== -->

  <g
    stroke="url(#glow)"
    fill="#DDF8FF"
    stroke-width="1.5"
    opacity="0.28"
  >

    <!-- Left -->

    <line
      x1="70"
      y1="125"
      x2="125"
      y2="95"
    />

    <line
      x1="125"
      y1="95"
      x2="175"
      y2="125"
    />

    <circle cx="70" cy="125" r="3"/>
    <circle cx="125" cy="95" r="4"/>
    <circle cx="175" cy="125" r="3"/>


    <!-- Right -->

    <line
      x1="825"
      y1="125"
      x2="875"
      y2="95"
    />

    <line
      x1="875"
      y1="95"
      x2="930"
      y2="125"
    />

    <circle cx="825" cy="125" r="3"/>
    <circle cx="875" cy="95" r="4"/>
    <circle cx="930" cy="125" r="3"/>

  </g>


  <!-- ========================================== -->
  <!-- MAIN HEADING -->
  <!-- ========================================== -->

  <text
    x="500"
    y="112"
    text-anchor="middle"
    font-family="Trebuchet MS, Arial, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="1.5"
    fill="#FFFFFF"
  >
    Netra R
  </text>


  <!-- ========================================== -->
  <!-- SUBTITLE -->
  <!-- ========================================== -->

  <text
    x="500"
    y="150"
    text-anchor="middle"
    font-family="Trebuchet MS, Arial, sans-serif"
    font-size="20"
    font-weight="600"
    letter-spacing="0.4"
    fill="#E8F7FF"
  >
    IT Student | Developer | AI Explorer
  </text>


  <!-- ========================================== -->
  <!-- TERMINAL STYLE LINE -->
  <!-- ========================================== -->

  <text
    x="500"
    y="195"
    text-anchor="middle"
    font-family="monospace"
    font-size="14"
    fill="#BDEFFF"
    opacity="0.8"
  >
    &gt;_ building ideas into real solutions
  </text>


  <!-- Blinking cursor -->

  <text
    x="735"
    y="195"
    font-family="monospace"
    font-size="14"
    fill="#67E8F9"
  >
    █

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />

  </text>


  <!-- ========================================== -->
  <!-- BOTTOM WAVE -->
  <!-- ========================================== -->

  <path
    d="
      M0 218

      C130 245 220 250 340 225
      C470 198 540 205 650 220
      C770 237 850 195 1000 220

      L1000 270
      L0 270
      Z
    "
    fill="#020B18"
    opacity="0.82"
  />


  <!-- Blue wave -->

  <path
    d="
      M0 235

      C130 250 220 255 340 235
      C470 210 540 215 650 230
      C770 248 850 210 1000 230
    "
    fill="none"
    stroke="url(#glow)"
    stroke-width="2"
    opacity="0.35"
  />


  <!-- ========================================== -->
  <!-- SMALL FLOATING SYMBOLS -->
  <!-- ========================================== -->

  <g
    font-family="monospace"
    font-size="17"
    fill="url(#glow)"
    opacity="0.25"
  >

    <text x="245" y="80">&lt;div&gt;</text>

    <text x="700" y="90">function()</text>

    <text x="430" y="225">{ code }</text>


    <animate
      attributeName="opacity"
      values="0.15;0.32;0.15"
      dur="4s"
      repeatCount="indefinite"
    />

  </g>


  <!-- ========================================== -->
  <!-- OUTER BORDER -->
  <!-- ========================================== -->

  <rect
    x="1"
    y="1"
    width="998"
    height="268"
    rx="15"
    fill="none"
    stroke="#67E8F9"
    stroke-width="1"
    opacity="0.18"
  />

</svg>
