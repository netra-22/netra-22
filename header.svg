<svg width="1000" height="230" viewBox="0 0 1000 230"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" x2="1">
  <stop offset="0%" stop-color="#161B22"/>
  <stop offset="50%" stop-color="#1C1633"/>
  <stop offset="100%" stop-color="#111827"/>
</linearGradient>

  <linearGradient id="glow" x1="0" x2="1">
    <stop offset="0%" stop-color="#58A6FF"/>
    <stop offset="100%" stop-color="#A371F7"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="1000" height="230" rx="10" fill="url(#bg)"/>

<!-- Subtle terminal grid -->
<g stroke="#58A6FF" opacity="0.07">
  <path d="M0 45 H1000"/>
  <path d="M0 185 H1000"/>
  <path d="M100 0 V230"/>
  <path d="M900 0 V230"/>
</g>

<!-- Moving binary -->
<g font-family="monospace" font-size="13"
   fill="#58A6FF" opacity="0.20">

  <text x="40" y="55">0101 0010 1101</text>
  <text x="760" y="45">1010 0110 0011</text>
  <text x="70" y="190">0011 1010 0101</text>
  <text x="790" y="190">1100 0101 1010</text>

  <animateTransform
    attributeName="transform"
    type="translate"
    from="0 0"
    to="35 0"
    dur="8s"
    repeatCount="indefinite"/>
</g>

<!-- Floating code symbols -->
<g font-family="monospace"
   font-size="22"
   fill="#58A6FF"
   opacity="0.35">

  <text x="75" y="110">&lt;/&gt;</text>
  <text x="875" y="115">{ }</text>
  <text x="120" y="160">=&gt;</text>
  <text x="840" y="165">()</text>

  <animate attributeName="opacity"
           values="0.15;0.4;0.15"
           dur="3s"
           repeatCount="indefinite"/>
</g>

<!-- Connected nodes -->
<g stroke="url(#glow)" fill="#58A6FF" opacity="0.35">

  <line x1="35" y1="75" x2="110" y2="100"/>
  <line x1="110" y1="100" x2="145" y2="75"/>

  <circle cx="35" cy="75" r="3"/>
  <circle cx="110" cy="100" r="4"/>
  <circle cx="145" cy="75" r="3"/>

  <line x1="850" y1="80" x2="920" y2="105"/>
  <line x1="920" y1="105" x2="970" y2="75"/>

  <circle cx="850" cy="80" r="3"/>
  <circle cx="920" cy="105" r="4"/>
  <circle cx="970" cy="75" r="3"/>
</g>

<!-- Terminal command -->
<text x="55" y="215"
      font-family="monospace"
      font-size="13"
      fill="#8B949E">
  &gt;_ building ideas into real solutions
</text>

<!-- Name -->
<text x="500" y="105"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="58"
      font-weight="bold"
      fill="white">
  Netra R
</text>

<!-- Role -->
<text x="500" y="145"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="20"
      font-weight="600"
      fill="#C9D1D9">
  IT Student | Developer | AI Explorer
</text>

<!-- Blinking cursor -->
<text x="500" y="175"
      text-anchor="middle"
      font-family="monospace"
      font-size="15"
      fill="#58A6FF">
  █
  <animate attributeName="opacity"
           values="1;0;1"
           dur="1s"
           repeatCount="indefinite"/>
</text>

</svg>
