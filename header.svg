<svg width="1000" height="230" viewBox="0 0 1000 230"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Premium blue gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#063B5C"/>
      <stop offset="35%" stop-color="#087EA4"/>
      <stop offset="68%" stop-color="#1559A8"/>
      <stop offset="100%" stop-color="#30206B"/>
    </linearGradient>

    <!-- Soft dark overlay -->
    <radialGradient id="darkGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#020817" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020817" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Cyan-purple glow -->
    <linearGradient id="lineGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

  </defs>


  <!-- Main background -->
  <rect
    width="1000"
    height="230"
    rx="14"
    fill="url(#bg)"
  />


  <!-- Soft blurred light -->
  <ellipse
    cx="220"
    cy="40"
    rx="250"
    ry="100"
    fill="#22D3EE"
    opacity="0.14"
    filter="url(#blur)"
  />

  <ellipse
    cx="790"
    cy="180"
    rx="250"
    ry="100"
    fill="#A855F7"
    opacity="0.12"
    filter="url(#blur)"
  />


  <!-- Dark glass overlay -->
  <rect
    width="1000"
    height="230"
    rx="14"
    fill="url(#darkGlow)"
  />


  <!-- Subtle grid -->
  <g
    stroke="#BDEFFF"
    stroke-width="1"
    opacity="0.07"
  >
    <line x1="0" y1="55" x2="1000" y2="55"/>
    <line x1="0" y1="115" x2="1000" y2="115"/>
    <line x1="0" y1="175" x2="1000" y2="175"/>

    <line x1="120" y1="0" x2="120" y2="230"/>
    <line x1="300" y1="0" x2="300" y2="230"/>
    <line x1="700" y1="0" x2="700" y2="230"/>
    <line x1="880" y1="0" x2="880" y2="230"/>
  </g>


  <!-- Floating code -->
  <g
    font-family="monospace"
    fill="#E0F7FF"
    font-size="14"
    opacity="0.25"
  >

    <text x="35" y="48">&lt;/&gt;</text>
    <text x="150" y="82">0101 0011</text>
    <text x="820" y="52">{ }</text>
    <text x="730" y="88">=&gt;</text>

    <text x="45" y="185">const idea = build();</text>
    <text x="805" y="185">1010 1101</text>

    <!-- Slow movement -->
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="30 0"
      dur="12s"
      repeatCount="indefinite"
    />

  </g>


  <!-- Floating symbols -->
  <g
    font-family="monospace"
    font-size="22"
    fill="#FFFFFF"
    opacity="0.28"
  >

    <text x="90" y="130">&lt;/&gt;</text>
    <text x="875" y="125">{ }</text>
    <text x="125" y="165">=&gt;</text>
    <text x="840" y="165">()</text>

    <animate
      attributeName="opacity"
      values="0.16;0.34;0.16"
      dur="4s"
      repeatCount="indefinite"
    />

  </g>


  <!-- Connected nodes -->
  <g
    stroke="url(#lineGlow)"
    fill="#CFFAFE"
    stroke-width="1.5"
    opacity="0.45"
  >

    <line x1="35" y1="80" x2="105" y2="105"/>
    <line x1="105" y1="105" x2="155" y2="75"/>

    <circle cx="35" cy="80" r="3"/>
    <circle cx="105" cy="105" r="4"/>
    <circle cx="155" cy="75" r="3"/>


    <line x1="845" y1="75" x2="910" y2="105"/>
    <line x1="910" y1="105" x2="970" y2="75"/>

    <circle cx="845" cy="75" r="3"/>
    <circle cx="910" cy="105" r="4"/>
    <circle cx="970" cy="75" r="3"/>

  </g>


  <!-- Animated accent line -->
  <path
    d="M40 205 C220 185 300 215 500 200
       C700 185 780 215 960 195"
    fill="none"
    stroke="url(#lineGlow)"
    stroke-width="2"
    opacity="0.45"
  >

    <animate
      attributeName="stroke-dasharray"
      values="20 30;80 20;20 30"
      dur="5s"
      repeatCount="indefinite"
    />

  </path>


  <!-- Small terminal text -->
  <text
    x="45"
    y="218"
    font-family="monospace"
    font-size="12"
    fill="#DDF8FF"
    opacity="0.65"
  >
    &gt;_ building ideas into real solutions
  </text>


  <!-- Main name -->
  <text
    x="500"
    y="105"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="58"
    font-weight="bold"
    fill="#FFFFFF"
  >
    Netra R
  </text>


  <!-- Subtitle -->
  <text
    x="500"
    y="145"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="21"
    font-weight="600"
    fill="#E8F7FF"
  >
    IT Student | Developer | AI Explorer
  </text>


  <!-- Blinking cursor -->
  <text
    x="500"
    y="175"
    text-anchor="middle"
    font-family="monospace"
    font-size="15"
    fill="#67E8F9"
  >
    &gt;_
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </text>


  <!-- Subtle border -->
  <rect
    x="1"
    y="1"
    width="998"
    height="228"
    rx="14"
    fill="none"
    stroke="url(#lineGlow)"
    stroke-width="2"
    opacity="0.55"
  />

</svg>
